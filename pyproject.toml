[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[project]
name = "upliftlab"
version = "0.1.0"
description = "Causal incrementality analysis from experiment readout to budget-constrained targeting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dhanush Pillay" }]
keywords = ["causal-inference", "uplift-modeling", "experimentation", "ab-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
upliftlab = "upliftlab.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "httpx2>=2.16.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy-stubs>=1.11",
  "types-requests>=2.31",
]

[tool.uv]
required-version = ">=0.10.6,<0.11"
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
  "NPY", "PD", "PERF", "PTH", "ARG", "C4", "DTZ", "TID", "PT", "RET", "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["upliftlab"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "network: requires an external download",
  "benchmark: long-running calibration or runtime test",
  "slow: takes more than a few seconds",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["upliftlab"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
